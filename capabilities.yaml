options:
  toolExposure: on-demand
  requiresCommands:
    - cli: npx
      description: Launches the owl-mcp MCP server (ships with Node.js)
    - cli: semlocal
      description: Required for local semantic memory (npm install -g semlocal)
skills:
  - id: capabilities-manager
    type: github
    def:
      repo: infragate/capa@capabilities-manager
      description: Guide for managing capabilities with capa CLI
      requires:
        - install
        - find_skills
  - id: cig-monitoring
    type: local
    def:
      path: ./skills/cig-monitoring
      description: >-
        Primary workflow: instantiate the PROforma CIG ontology
        (cig/proforma.owl) for a clinical guideline. Model therapy
        recommendations and monitoring of desired/undesired effects as PROforma
        Plans, Actions, Components and Goals (State Achievement goals with verb
        achieve/avoid; Action Enactment goals with verb order and FHIR
        ServiceRequest). Use when turning a guideline into a CIG or building a
        therapy + monitoring plan.
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.add_data_property_assertion'
        - '@owl.add_annotation_assertion'
        - '@owl.add_object_property_assertion'
        - '@owl.add_class_assertion'
        - '@owl.add_prefix'
        - '@owl.set_ontology_iri'
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.sparql_query'
  - id: cig-formalization
    type: local
    def:
      path: ./skills/cig-formalization
      description: >-
        Deterministic Step 6 emitter: materialize an APPROVED PROforma CIG
        monitoring proposal into OWL via the ontology-editor tools. Default is
        a fresh-file full re-emit (canonical IRIs, fixed per-action bundle,
        ServiceRequest on both the Goal noun_phrase and the Action metaprops).
        Coding-only requests use coding-patch mode: do not delete the OWL; add
        typed coding keys on existing Actions only. Keep one rdfs:label/comment
        with no hand-written counts, and self-apply the end-of-Step-6
        determinism check. Use whenever an approved proposal must be
        formalized/regenerated, or when adding SNOMED/OMOP/LOINC codes to an
        existing CIG.
      requires:
        - '@owl.add_axioms'
        - '@owl.add_data_property_assertion'
        - '@owl.add_annotation_assertion'
        - '@owl.add_object_property_assertion'
        - '@owl.add_class_assertion'
        - '@owl.remove_axiom'
        - '@owl.add_prefix'
        - '@owl.set_ontology_iri'
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.ontology_metadata'
        - '@owl.get_labels_for_iri'
  - id: odp-pattern-selector
    type: local
    def:
      path: ./skills/odp-pattern-selector
      description: Select a pattern from the ODP pattern library
  - id: cq-verification
    type: local
    def:
      path: ./skills/cq-verification
      description: >-
        Verify competency questions against an OWL ontology using SPARQL queries
        with test data. Use during Step 7, or whenever the user asks to test,
        validate, or verify an ontology against its CQs.
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.add_data_property_assertion'
        - '@owl.add_object_property_assertion'
        - '@owl.add_class_assertion'
        - '@owl.add_prefix'
        - '@owl.set_ontology_iri'
        - '@owl.find_axioms'
        - '@owl.sparql_query'
  - id: cig-monitoring-review
    type: local
    def:
      path: ./skills/cig-monitoring-review
      description: >-
        Mandatory Step 7 value-quality gate for CIG monitoring builds. Checks
        that every monitoring Action's pf:metaprops has real content (rejects
        placeholders like source=s), that the ServiceRequest order is on BOTH
        the Goal noun_phrase and the Action metaprops, that case-report sources
        document a drug harm and are in approved-proposal scope, that each
        action traces to a monitored target, that no empty placeholder
        components or unpopulated Enquiry/Decision remain, and that coding-only
        runs do not rewrite IRIs, captions, or Decision candidates. Replaces
        the gameable presence-only metaprops check.
      requires:
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.sparql_query'
  - id: ontology-editor
    type: local
    def:
      path: ./skills/ontology-editor
      description: OWL-MCP tools for ontology editing (axioms, prefixes, IRI,
        pitfalls, quality)
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.add_data_property_assertion'
        - '@owl.add_annotation_assertion'
        - '@owl.add_object_property_assertion'
        - '@owl.add_class_assertion'
        - '@owl.remove_axiom'
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.add_prefix'
        - '@owl.ontology_metadata'
        - '@owl.get_labels_for_iri'
        - '@owl.set_ontology_iri'
        - '@owl.test_quality'
        - '@owl.test_pitfalls'
  - id: semlocal
    type: github
    def:
      repo: Minitour/semlocal@semlocal
      description: >-
        Store, search, and delete text using local semantic search (semlocal
        CLI). Use for long-term memory, knowledge extraction, and recall across
        sessions.
      requires: []
  - id: skill-creator
    type: github
    def:
      repo: anthropics/skills@skill-creator
agents:
  base:
    type: local
    path: ./.workflow/WORKFLOW.md
  additional:
    - type: inline
      id: cig_monitoring_workflow
      content: >-
        This kit's primary purpose is instantiating the PROforma CIG ontology
        (cig/proforma.owl) for clinical guidelines, focusing on monitoring of
        therapy completion and of desired/undesired effects. For CIG tasks
        follow the cig-monitoring skill: read guideline PDFs from the shared
        cig/guidelines/ library; extract therapy recommendations, clinical
        goals, ADEs and monitoring (proposing monitoring frequencies with
        justification when the guidelines omit them); then build a PROforma
        Top-Level Plan with an Enquiry, a Decision, a Therapy Plan, and a
        Monitoring Plan in sequence (the Monitoring Plan has parallel Monitor
        Actions / Monitor Desired State / Monitor Undesired ADEs sub-plans).
        Scope the design pattern to the request: build ONLY the requested
        sub-structure and never emit empty placeholder components, an Enquiry
        with no data items, or a Decision with no candidates/criteria — populate
        the Enquiry's data items and the Decision's candidates+criteria from the
        PROforma spec (see references/Enquiry.md and references/Decision.md).
        Model each therapy intervention as an Action + Component with a State
        Achievement Goal (verb achieve/avoid), and each monitoring item as an
        Action + Component with an Action Enactment Goal (verb order, FHIR
        ServiceRequest). The ServiceRequest order must carry ALL FIVE fields —
        ServiceRequest.intent, ServiceRequest.code,
        ServiceRequest.occurrenceTiming, ServiceRequest.patientInstruction, and
        ServiceRequest.performerInstruction (performerInstruction is REQUIRED
        whenever there is a triggered lab or an urgent/escalation step, e.g. "if
        symptoms occur, order serum CK/CPK, creatinine/eGFR, electrolytes
        including potassium and phosphate, urinalysis for blood/myoglobin
        pattern, and assess hydration/AKI risk") — never stop at intent + code.
        Assert pf:metaprops on every monitoring Action following the canonical
        grammar in references/MetapropsSyntax.md — NO placeholder values
        (source=s, instrument=i): the full ServiceRequest.* block must appear on
        BOTH the Goal noun_phrase AND the Action metaprops, with real citations
        and provenance/operationalization keys (category, monitored_target,
        provenance_type, source(s), knowledge_origin, guideline_status,
        literature_basis, assistant_invention, instrument,
        monitoring_frequency_basis, trigger, cq) so sourced facts are separable
        from self-designed ones and each action traces to the harm/goal it
        monitors. Case-report sources are opt-in (only if the user/proposal
        includes them) and must document a drug harm (not symptom resolution
        after stopping). Write long metaprops/noun_phrase literals
        with the structured assertion tools so they are not truncated. Step 6 is
        a DETERMINISTIC emit: delegate it to the
        cig-formalizer subagent, which treats the approved proposal as the
        single source of truth. Full re-emits build into a FRESH/EMPTY file
        (never append to a prior run). Coding-only requests (add SNOMED/OMOP/
        LOINC) use coding-patch mode: do not delete the OWL; freeze IRIs,
        captions, Decision candidates, occurrenceTiming, and source= strings;
        add only typed coding keys. Use the canonical IRI fixed in the proposal
        (one IRI per ADE/label section), and emit the approved action set
        EXACTLY with no duplicates, no shared Goals, the ontology IRI set, and
        a single rdfs:label/comment. Step 7 is a BLOCKING gate: delegate to the
        cig-monitoring-reviewer subagent (runs cig-monitoring-review, which
        inspects metaprops VALUES not just keys) and the cig-cq-verifier
        subagent. The gate re-runs the FULL check set every time, treats
        scope/residue/duplicate mismatches, missing ServiceRequest fields, out-
        of-scope case-report actions, and coding-only caption/IRI drift as
        hard FAILs, never waives a FAIL or inherits a prior PASS, and PASSes
        only when zero FAILs remain. Reuse PROforma classes/properties by IRI
        and imitate cig/examples/obesity-glp1-monitoring.owl plus
        skills/cig-monitoring/references/ActionEnactmentGoal.md.
    - type: inline
      id: capa_tool_usage
      content: >-
        After learning a new skill, call `setup_tools(skills: ["<skill-id>"])`
        to activate it, then use `call_tool(name: "<tool>", data: {...})` to
        invoke the relevant tool.
    - type: inline
      id: ontology_builder_tools
      content: >-
        For ontology work: edit OWL only via the ontology-editor tools (never by
        hand); check quality with the OWL-MCP test_pitfalls and test_quality
        tools; and verify competency questions by running SPARQL with the
        sparql_query tool (pass the ontology and test-data file paths together
        so they are merged into one graph before querying).
subagents:
  - id: cig-formalizer
    description: >-
      Deterministic PROforma OWL emitter for Step 6 of a CIG monitoring build.
      Use to formalize an APPROVED proposal into an OWL ABox. Full re-emits
      regenerate from an empty file (never append to a prior run). Coding-only
      requests patch typed coding keys on the existing file without deleting it
      or rewriting captions, IRIs, or Decision candidates. Delegate the
      formalization step to this subagent.
    skills:
      - cig-formalization
      - ontology-editor
    tools:
      - add_axioms
      - add_data_property_assertion
      - add_annotation_assertion
      - add_object_property_assertion
      - add_class_assertion
      - remove_axiom
      - find_axioms
      - get_all_axioms
      - add_prefix
      - set_ontology_iri
      - ontology_metadata
      - get_labels_for_iri
      - test_pitfalls
      - test_quality
    instructions: |
      You are the cig-formalizer. You run Step 6 (Formalization) of a CIG
      monitoring build and nothing else. FOLLOW THE `cig-formalization` SKILL
      (loaded for you) as the authoritative recipe — it defines emit-mode
      selection (full re-emit vs coding-patch), the fresh-file rule for full
      re-emits, canonical IRIs, the fixed per-action bundle, ServiceRequest-on-
      both-sides, the annotation discipline, and the end-of-Step-6 determinism
      check.

      The APPROVED proposal (`projects/<project_dir>/plans/PROPOSAL-*.md`,
      status: approved) is your SINGLE SOURCE OF TRUTH; its §6 Individuals tables
      are the verbatim IRI list. Read it and the worked example
      `cig/examples/obesity-glp1-monitoring.owl`, then emit OWL via the
      ontology-editor tools only — never edit OWL by hand. If the proposal is
      missing or not approved, stop and report instead of emitting.

      Choose the emit mode first. If the user asked only to add terminology
      codes (SNOMED/OMOP/LOINC) or the proposal marks `mode: coding-patch`, do
      NOT delete the file. Patch only `ServiceRequest.supportingInfo.*Codes` on
      existing Actions. MUST NOT rename IRIs, change captions, Decision
      candidates, occurrenceTiming, or source= strings. If the proposal action
      set differs from the existing OWL, stop — that is not a coding patch.

      Non-negotiables for a full re-emit (the skill expands each): build into a
      FRESH/EMPTY file (delete any existing project ontology first; never append
      to a prior run); emit the approved action set EXACTLY (no residue, no
      renames, no duplicates, no two Actions sharing a Goal, single plan root);
      every monitoring Goal noun_phrase AND Action metaprops carries all five
      ServiceRequest.* fields (incl. performerInstruction for triggered/urgent
      steps); no placeholder values; write long literals with
      add_data_property_assertion. Before returning, run the skill's
      determinism check with find_axioms/get_all_axioms and report each result
      (Action count == approved §6; one metaprops + one Goal + one noun_phrase
      per Action; ontology IRI + version IRI set; exactly one rdfs:label and one
      rdfs:comment with no hand-written counts).
  - id: cig-monitoring-reviewer
    description: >-
      Independent BLOCKING value-quality + structural gate for Step 7 of a CIG
      monitoring build (runs the cig-monitoring-review skill). Use to review or
      re-review a PROforma monitoring ontology. It re-runs the FULL check set
      every time, treats scope/duplicate/residue mismatches and missing
      ServiceRequest fields as hard FAILs, and never waives a FAIL.
    skills:
      - cig-monitoring-review
    tools:
      - find_axioms
      - get_all_axioms
      - sparql_query
    instructions: |
      You are the cig-monitoring-reviewer. Run the cig-monitoring-review skill
      as a TRUE BLOCKING GATE, independent of whoever built the ontology. Always
      pass both the project ontology and `cig/proforma.owl` to sparql_query. When
      this is an iteration (a prior approved `projects/<project_dir>/plans/
      PROPOSAL-*.md`, a prior project ontology, or a `semlocal --collection
      <project_dir>` baseline exists), also load that baseline and diff it
      against the current build.

      Gate rules:
      - Re-run the COMPLETE check set every time, including on a re-check. A
        re-check may NEVER inherit a prior PASS, re-verify only a subset, or drop
        a previously reported FAIL from the verdict.
      - PASS if and only if there are ZERO FAILs across the full set.
      - The following are HARD blocking FAILs, not WARNs, notes, or "optional"
        recommendations:
          * the built action set differs from the approved proposal's set
            (extras, residue from a prior session, or missing actions);
          * duplicate concepts / duplicate Action IRIs for the same ADE;
          * two or more plan roots, or two Actions sharing one Goal;
          * an individual with duplicate metaprops or duplicate noun_phrase;
          * the ontology IRI is unset (anonymous Ontology(...) header);
          * more than one rdfs:label or rdfs:comment;
          * any monitoring Goal noun_phrase or Action metaprops missing any of
            the five ServiceRequest.* fields (intent, code, occurrenceTiming,
            patientInstruction, performerInstruction when a triggered/urgent step
            exists);
          * placeholder values, ServiceRequest inconsistency between Goal and
            Action, untraceable monitored_target, or a stance↔schedule conflict;
          * a case-report Action that is not explicitly in the approved
            proposal's scope;
          * CODING-ONLY DRIFT: on a coding-patch run, any change to Action IRIs,
            captions, Decision candidates, Goal noun_phrase, occurrenceTiming,
            or source= strings (only the four supportingInfo.*Codes keys may be
            added/updated);
          * BASELINE REGRESSION (iterations only): a therapy Action or goal —
            especially an `avoid` State Achievement Goal or the top-plan `treat`
            goal — an Enquiry Data/Source item, a Decision
            Candidate/Argument/criterion/recommendation, or a monitoring Action
            that is present in the prior approved baseline but ABSENT from the
            current proposal/build without an explicit, source-grounded §10
            Excluded-Candidate entry. A new source may only add or refine; a
            silent drop of previously-approved content is a FAIL, not a WARN.
      - There is NO "keep it because it is well implemented" and NO "human
        confirmation needed" path to PASS. The artifact conforms to the approved
        plan or it FAILs.
      - Emit the readable report under `projects/<project_dir>/reviews/` and, if
        anything FAILs, hand the fix list back to the cig-formalizer; do not
        report the CIG as done while any FAIL remains.
  - id: cig-cq-verifier
    description: >-
      Competency-question verification subagent for Step 7 (runs the
      cq-verification skill). Use to verify every CQ of a CIG monitoring
      ontology with real SPARQL execution over the ontology + test data merged
      into one graph.
    skills:
      - cq-verification
    tools:
      - add_axioms
      - add_data_property_assertion
      - add_object_property_assertion
      - add_class_assertion
      - add_prefix
      - set_ontology_iri
      - find_axioms
      - sparql_query
    instructions: |
      You are the cig-cq-verifier. Run the cq-verification skill for Step 7.
      Create test data, write a SPARQL query for EVERY competency question in the
      approved proposal, and execute each one with sparql_query, passing the
      project ontology, `cig/proforma.owl`, and the test-data file together so
      schema + individuals are merged into one graph (never query test data
      alone). Every CQ must appear in the results table. If any CQ fails due to
      an ontology gap, report it so the build returns to Step 6.
servers:
  # Minitour/owl-mcp (Rust): https://github.com/Minitour/owl-mcp
  - id: owl
    type: mcp
    description: OWL ontology editing via MCP (find/add/remove axioms, OWL
      functional syntax)
    def:
      cmd: npx
      args:
        - -y
        - owl-mcp@1.0.11
        - serve
tools:
  - id: add_axioms
    type: mcp
    description: Add multiple axioms to an OWL file
    def:
      server: '@owl'
      tool: add_axioms
  - id: add_data_property_assertion
    type: mcp
    description: >-
      Assert a data property value with the literal passed as a separate field
      (no escaping/shell-quoting). Use for long or special-character literals
      such as CIG pf:metaprops / noun_phrase strings.
    def:
      server: '@owl'
      tool: add_data_property_assertion
  - id: add_annotation_assertion
    type: mcp
    description: >-
      Assert an annotation value with the literal passed as a separate field (no
      escaping). Use for long annotation literals (rdfs:comment, etc.).
    def:
      server: '@owl'
      tool: add_annotation_assertion
  - id: add_object_property_assertion
    type: mcp
    description: Link two individuals via an object property (subject -> target).
    def:
      server: '@owl'
      tool: add_object_property_assertion
  - id: add_class_assertion
    type: mcp
    description: Assert that an individual is an instance of a class.
    def:
      server: '@owl'
      tool: add_class_assertion
  - id: remove_axiom
    type: mcp
    description: Remove one axiom from an OWL file
    def:
      server: '@owl'
      tool: remove_axiom
  - id: find_axioms
    type: mcp
    description: Find axioms matching a pattern in an OWL file
    def:
      server: '@owl'
      tool: find_axioms
  - id: get_all_axioms
    type: mcp
    description: Get all axioms from an OWL file
    def:
      server: '@owl'
      tool: get_all_axioms
  - id: add_prefix
    type: mcp
    description: Add a prefix mapping to an OWL file
    def:
      server: '@owl'
      tool: add_prefix
  - id: ontology_metadata
    type: mcp
    description: Get ontology metadata/annotations
    def:
      server: '@owl'
      tool: ontology_metadata
  - id: get_labels_for_iri
    type: mcp
    description: Get labels for an IRI in an OWL file
    def:
      server: '@owl'
      tool: get_labels_for_iri
  - id: set_ontology_iri
    type: mcp
    description: Set or update the ontology IRI and version IRI
    def:
      server: '@owl'
      tool: set_ontology_iri
  - id: test_pitfalls
    type: mcp
    description: Scan for common modeling pitfalls in an OWL file
    def:
      server: '@owl'
      tool: test_pitfalls
  - id: test_quality
    type: mcp
    description: >-
      Evaluate ontology quality with the OQuaRE framework (uses the whelk OWL EL
      reasoner to compute the inferred class hierarchy); returns metrics,
      subcharacteristics, and an overall 1-5 quality score
    def:
      server: '@owl'
      tool: test_quality
  - id: sparql_query
    type: mcp
    description: >-
      Run a SPARQL query over one or more OWL files. Pass several owl_file_paths
      to merge a schema with its ABox/test data in-memory before querying (used
      for competency-question verification). SELECT/ASK return SPARQL JSON.
    def:
      server: '@owl'
      tool: sparql_query
