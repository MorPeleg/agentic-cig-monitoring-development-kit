options:
  toolExposure: on-demand
  requiresCommands:
    - cli: npx
      description: Launches the owl-mcp MCP server (ships with Node.js)
    - cli: semlocal
      description: Required for local semantic memory (npm install -g semlocal)
skills:
  - id: capabilities-manager
    type: github
    def:
      repo: infragate/capa@capabilities-manager
      description: Guide for managing capabilities with capa CLI
      requires:
        - install
        - find_skills
  - id: cig-monitoring
    type: local
    def:
      path: ./skills/cig-monitoring
      description: >-
        Primary workflow: instantiate the PROforma CIG ontology
        (cig/proforma.owl) for a clinical guideline. Model therapy
        recommendations and monitoring of desired/undesired effects as PROforma
        Plans, Actions, Components and Goals (State Achievement goals with verb
        achieve/avoid; Action Enactment goals with verb order and FHIR
        ServiceRequest). Use when turning a guideline into a CIG or building a
        therapy + monitoring plan.
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.add_prefix'
        - '@owl.set_ontology_iri'
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.sparql_query'
  - id: odp-pattern-selector
    type: local
    def:
      path: ./skills/odp-pattern-selector
      description: Select a pattern from the ODP pattern library
  - id: cq-verification
    type: local
    def:
      path: ./skills/cq-verification
      description: >-
        Verify competency questions against an OWL ontology using SPARQL queries
        with test data. Use during Step 7, or whenever the user asks to test,
        validate, or verify an ontology against its CQs.
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.add_prefix'
        - '@owl.set_ontology_iri'
        - '@owl.find_axioms'
        - '@owl.sparql_query'
  - id: ontology-editor
    type: local
    def:
      path: ./skills/ontology-editor
      description: OWL-MCP tools for ontology editing (axioms, prefixes, IRI,
        pitfalls, quality)
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.remove_axiom'
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.add_prefix'
        - '@owl.ontology_metadata'
        - '@owl.get_labels_for_iri'
        - '@owl.set_ontology_iri'
        - '@owl.test_quality'
        - '@owl.test_pitfalls'
  - id: semlocal
    type: remote
    def:
      url: https://raw.githubusercontent.com/Minitour/semlocal/refs/heads/main/skills/semlocal/SKILL.md
      description: >-
        Store, search, and delete text using local semantic search (semlocal
        CLI). Use for long-term memory, knowledge extraction, and recall across
        sessions.
      requires: []
agents:
  base:
    type: local
    path: ./WORKFLOW.md
  additional:
    - type: inline
      id: cig_monitoring_workflow
      content: >-
        This kit's primary purpose is instantiating the PROforma CIG ontology
        (cig/proforma.owl) for clinical guidelines, focusing on monitoring of
        therapy completion and of desired/undesired effects. For CIG tasks
        follow the cig-monitoring skill: read guideline PDFs from the shared
        cig/guidelines/ library; extract therapy recommendations, clinical
        goals, ADEs and monitoring (proposing monitoring frequencies with
        justification when the guidelines omit them); then build a PROforma
        Top-Level Plan with an Enquiry, a Decision, a Therapy Plan, and a
        Monitoring Plan in sequence (the Monitoring Plan has parallel Monitor
        Actions / Monitor Desired State / Monitor Undesired ADEs sub-plans).
        Model each therapy intervention as an Action + Component with a State
        Achievement Goal (verb achieve/avoid), and each monitoring item as an
        Action + Component with an Action Enactment Goal (verb order, FHIR
        ServiceRequest with intent/code/occurrenceTiming/patientInstruction).
        Assert pf:metaprops on every monitoring Action: repeat the ServiceRequest
        order and document provenance and operationalization (source, knowledge
        origin, guideline_status, literature_basis, assistant_invention,
        instrument, monitoring_frequency_basis, trigger, monitored_target) so
        sourced facts are separable from self-designed ones; case-report sources
        must document a drug harm (not symptom resolution after stopping); and
        verify metaprops completeness with sparql_query in Step 7. Reuse PROforma
        classes/properties by IRI and imitate cig/examples/obesity-glp1.owl plus
        skills/cig-monitoring/references/ActionEnactmentGoal.md.
    - type: inline
      id: capa_tool_usage
      content: >-
        After learning a new skill, call `setup_tools(skills: ["<skill-id>"])`
        to activate it, then use `call_tool(name: "<tool>", data: {...})` to
        invoke the relevant tool.
    - type: inline
      id: ontology_builder_tools
      content: >-
        For ontology work: edit OWL only via the ontology-editor tools (never by
        hand); check quality with the OWL-MCP test_pitfalls and test_quality
        tools; and verify competency questions by running SPARQL with the
        sparql_query tool (pass the ontology and test-data file paths together
        so they are merged into one graph before querying).
servers:
  # Minitour/owl-mcp (Rust): https://github.com/Minitour/owl-mcp
  - id: owl
    type: mcp
    description: OWL ontology editing via MCP (find/add/remove axioms, OWL
      functional syntax)
    def:
      cmd: npx
      args:
        - -y
        - owl-mcp@1.0.10
        - serve
tools:
  - id: add_axioms
    type: mcp
    description: Add multiple axioms to an OWL file
    def:
      server: '@owl'
      tool: add_axioms
  - id: remove_axiom
    type: mcp
    description: Remove one axiom from an OWL file
    def:
      server: '@owl'
      tool: remove_axiom
  - id: find_axioms
    type: mcp
    description: Find axioms matching a pattern in an OWL file
    def:
      server: '@owl'
      tool: find_axioms
  - id: get_all_axioms
    type: mcp
    description: Get all axioms from an OWL file
    def:
      server: '@owl'
      tool: get_all_axioms
  - id: add_prefix
    type: mcp
    description: Add a prefix mapping to an OWL file
    def:
      server: '@owl'
      tool: add_prefix
  - id: ontology_metadata
    type: mcp
    description: Get ontology metadata/annotations
    def:
      server: '@owl'
      tool: ontology_metadata
  - id: get_labels_for_iri
    type: mcp
    description: Get labels for an IRI in an OWL file
    def:
      server: '@owl'
      tool: get_labels_for_iri
  - id: set_ontology_iri
    type: mcp
    description: Set or update the ontology IRI and version IRI
    def:
      server: '@owl'
      tool: set_ontology_iri
  - id: test_pitfalls
    type: mcp
    description: Scan for common modeling pitfalls in an OWL file
    def:
      server: '@owl'
      tool: test_pitfalls
  - id: test_quality
    type: mcp
    description: >-
      Evaluate ontology quality with the OQuaRE framework (uses the whelk OWL EL
      reasoner to compute the inferred class hierarchy); returns metrics,
      subcharacteristics, and an overall 1-5 quality score
    def:
      server: '@owl'
      tool: test_quality
  - id: sparql_query
    type: mcp
    description: >-
      Run a SPARQL query over one or more OWL files. Pass several owl_file_paths
      to merge a schema with its ABox/test data in-memory before querying (used
      for competency-question verification). SELECT/ASK return SPARQL JSON.
    def:
      server: '@owl'
      tool: sparql_query
